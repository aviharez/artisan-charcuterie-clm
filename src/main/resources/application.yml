spring:
  application:
    name: artisan-charcuterie

  datasource:
    url: jdbc:h2:mem:clmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: ${PORT:8080}
  error:
    include-message: always
    inclue-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  info:
    title: Artisan Charcuterie CLM API
    version: 1.0.0

clm:
  stress-alert:
    temperature-tolerance-celsius: 2.0
    exposure-threshold-hours: 4
  weight-loss:
    prosciutto-percent: 30.0
    bresaola-percent: 35.0
    culatello-precent: 28.0